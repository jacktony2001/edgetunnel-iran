name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Syntax check
        run: node --check _worker.js

      - name: English-only content (no CJK, Arabic/Persian or Cyrillic anywhere)
        run: |
          hits=$(git ls-files | xargs -r grep -lP '[\x{4E00}-\x{9FFF}\x{3040}-\x{30FF}\x{AC00}-\x{D7AF}\x{0600}-\x{06FF}\x{0750}-\x{077F}\x{08A0}-\x{08FF}\x{0400}-\x{04FF}]' || true)
          if [ -n "$hits" ]; then
            echo "Non-English characters found in:"
            echo "$hits"
            exit 1
          fi
          echo "All tracked files use Latin script only."

      - name: Entry point and settings sanity
        run: |
          grep -q 'main = "_worker.js"' wrangler.toml || { echo "wrangler.toml must point at _worker.js"; exit 1; }
          grep -q 'publicProxyPool' _worker.js || { echo "public proxyIP pool is missing"; exit 1; }
          grep -q 'edt-pages' _worker.js && { echo "worker still depends on the remote admin page"; exit 1; }
          echo "lines: $(wc -l < _worker.js)  bytes: $(wc -c < _worker.js)"
