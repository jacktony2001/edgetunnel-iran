name: Deploy

# Manual one-click redeploy of the Cloudflare Worker.
# Requires the repository secret CLOUDFLARE_API_TOKEN (Cloudflare dashboard ->
# My Profile -> API Tokens -> Create Token -> "Edit Cloudflare Workers" template).
# Add it under Settings -> Secrets and variables -> Actions, then run this workflow
# from the Actions tab. Add `push: branches: [main]` to on: if you want auto-deploy.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check the token
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Create an API token in the Cloudflare dashboard (Edit Cloudflare Workers template, plus Workers KV Storage: Edit) and add it to Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 02b2baadc799c4b52d1d8b9a4f21f97f
        run: npx wrangler@4 deploy
